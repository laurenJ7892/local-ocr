[project]
name = "handwriting-eval"
version = "0.1.0"
description = "Compare local vision models on handwritten notebook pages."
requires-python = ">=3.12,<3.13"
dependencies = [
    "jiwer",
    "mlx-vlm",
    "pillow",
    "python-Levenshtein",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
fixable = ["ALL"]
